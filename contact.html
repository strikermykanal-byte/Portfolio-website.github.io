<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="image/favicon.png">
    <link rel="stylesheet" href="contact.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >

    <title>Contact</title>
</head>

<body>

    <!-- Navigation -->
    <nav class="sidebar">
        <div class="side">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>


    <!-- Contact -->
    <main class="content">

        <div class="contact">

            <h1>Contact</h1>

            <hr>


            <!-- Theme button -->
            <button
                id="theme-toggle"
                type="button"
                class="icon-toggle"
            >
                <i class="fa-solid fa-repeat"></i>
                <span class="toggle-text"></span>
            </button>

<form action=
"https://formspree.io/f/xgaezjak"
method="POST"
>
            <!-- Email -->
            <label for="email">
                <b>
                    Email
                    <i class="fa-solid fa-envelope"></i>
                </b>
            </label>

            <input
                type="text"
                id="email"
                placeholder="registerform@register.yep"
                required
            >

            
<!-- Username -->
            <label for="psw">
                <b>
                    UserName
                    <i class="fa-solid fa-circle-user"></i>
                </b>
            </label>

            <input
                type="password"
                id="psw"
                placeholder="Enter your username"
                required
            >


            <!-- Phone -->
            <label for="numb-phone">
                <b>
                    Number
                    <i class="fa-solid fa-phone"></i>
                </b>
            </label>

            <input
                type="number"
                id="numb-phone"
                name="numb-phone"
                placeholder="Enter your phone number"
                required
            >
            <label for="message">
                <b>Message  <i class="fa-solid fa-comment"></i></b>
            </label>
            <textarea
             name="message" 
             id="message"
             placeholder="Leave your message here"
             rows="5"
             required
            ></textarea>
            <hr>
            <div class="enterBtn">
                <button id="enter-btn">Confirm <i class="fa-duotone fa-solid fa-check-to-slot"></i></button>
            </div>
            </form>
            <p id="thank-you-message" style="display: none; color: green;";></p>
            
            
        </div>

    </main>


    <script src="contact.js"></script>

</body>
</html>
